# =============================================================
# SNS投稿をビルド済みHTMLへ反映するための「変化があるときだけ」再ビルド
# =============================================================
# SNS投稿は次の2経路で表示されます。
#
#   A. 実行時API（/api/social-feed）
#      → 定期同期Worker（worker/social-cron、3分ごと）がSNSから取得し、画像もサイト側へ保存。
#        ページを開くと、JavaScriptがこの最新の結果でカードを追加・更新する。
#        新しい投稿は、原則として投稿から5分以内にここへ反映される。
#   B. ビルド時のHTML（scripts/sync-social-posts.mjs）
#      → 検索エンジンやJavaScriptが動かない環境向けに、ビルド時点の投稿をHTMLへ書き出す。
#
# このワークフローは B を最新に保つためのものです。本番APIの投稿一覧の「署名」と、
# 現在公開中のビルドの署名（/social-build-manifest.json）を比べ、
# 変化があるときだけCloudflare Pagesのデプロイフックを呼び出して再ビルドします。
# 変化が無いときは何もしない（コミットもデプロイも行わない）ため、不要なビルドは発生しません。
# 判定は scripts/social-rebuild.mjs（サイトの定期チェックと共通）。同じ計算方法の署名どうしを比べ、
# 直前のビルドから20分以内は再ビルドしないため、不一致が続いても再ビルドを繰り返しません。
#
# 必要な設定（2026年9月7日に設定済み）
#   GitHub → Settings → Secrets and variables → Actions
#   CLOUDFLARE_DEPLOY_HOOK_URL : Cloudflare Pagesのデプロイフック（URL自体が秘密情報）

name: Refresh social posts

on:
  schedule:
    # 15分ごと（GitHub Actionsの定期実行は混雑時に数分〜十数分遅れることがあります）。
    # 閲覧者への最新投稿の表示はAの経路で5分以内に行われるため、ここはHTMLの追従用です。
    - cron: "*/15 * * * *"
  # 手動実行（Actionsタブの「Run workflow」）。force=true で変化が無くても再ビルドする
  workflow_dispatch:
    inputs:
      force:
        description: "変化が無くても再ビルドする"
        type: boolean
        default: false

concurrency:
  group: refresh-social-posts
  cancel-in-progress: false

jobs:
  rebuild-if-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 本番APIと公開中のビルドの内容を比べる
        id: compare
        env:
          SITE_URL: https://nobeoka-ugokasu.pages.dev
          FORCE: ${{ github.event.inputs.force }}
        run: |
          node --input-type=module -e '
            import { decideSocialRebuild } from "./scripts/social-rebuild.mjs";
            import { appendFileSync } from "node:fs";
            const site = process.env.SITE_URL;
            const get = async (p) => {
              const res = await fetch(site + p + (p.includes("?") ? "&" : "?") + "t=" + Date.now(), { headers: { "Cache-Control": "no-cache" } });
              if (!res.ok) throw new Error(p + " HTTP " + res.status);
              return res.json();
            };
            let feed = null;
            let manifest = null;
            try { feed = await get("/api/social-feed"); } catch (e) { console.log("::warning::本番APIを読めませんでした: " + e.message); }
            try { manifest = await get("/social-build-manifest.json"); } catch (e) { console.log("manifest:", e.message); }
            // 本番APIが一時的に応答しない場合は、再ビルドせずに次回へ回す（state=unknown）
            const result = decideSocialRebuild({ feed, manifest, force: process.env.FORCE === "true" });
            const age = result.buildAgeMinutes === null ? "不明" : Math.round(result.buildAgeMinutes) + "分前";
            console.log(`最新=${result.latest} 公開中=${result.built} 公開中のビルド=${age} 判定=${result.state} 再ビルド=${result.rebuild}`);
            if (result.state === "waiting") console.log("直前のビルドから間もないため、今回は再ビルドしません（次回に再確認）。");
            appendFileSync(process.env.GITHUB_OUTPUT, `changed=${result.rebuild}\n`);
          '

      - name: 変化があるときだけCloudflare Pagesを再ビルドする
        if: steps.compare.outputs.changed == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::CLOUDFLARE_DEPLOY_HOOK_URL が未設定のため、再ビルドをスキップしました。"
            exit 0
          fi
          # -s/-o /dev/null でレスポンス本文を出さず、HTTPステータスだけを確認する
          # （デプロイフックURLそのものがログへ出ないようにする）
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$DEPLOY_HOOK_URL")
          echo "デプロイフックの応答: HTTP $status"
          case "$status" in
            200|201|202) echo "再ビルドを開始しました。" ;;
            *) echo "::error::再ビルドの開始に失敗しました (HTTP $status)"; exit 1 ;;
          esac
